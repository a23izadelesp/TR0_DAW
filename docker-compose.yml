version: '3.8'

services:
  web:
    build:
      context: ./images
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:9.3
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: quizdb
      LANG: C.UTF-8

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
